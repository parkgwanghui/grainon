<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>샘플 출고</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{
    --bg:#F1F4F1; --card:#FFFFFF; --ink:#17211B; --sub:#5C6A61; --line:#D8E0DA;
    --green:#2D6A4F; --green-d:#1E4D38; --amber:#F2B233; --red:#B9400E;
    --main:var(--green); --main-d:var(--green-d);
  }
  body.in{--main:#2F5A8A; --main-d:#1F3F63}
  body.stock{--main:#3D4842; --main-d:#27302B}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-text-size-adjust:100%}
  button,input,textarea{font-family:inherit}
  button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--amber);outline-offset:1px}

  header{position:sticky;top:0;z-index:5;background:var(--main);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 12px}
  .htop{display:flex;justify-content:space-between;align-items:center;gap:10px}
  header h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
  header p{margin:4px 0 12px;font-size:13px;opacity:.9;display:flex;align-items:center;flex-wrap:wrap;gap:6px}
  .seg{display:flex;background:rgba(255,255,255,.18);border-radius:10px;padding:3px;flex:none}
  .seg button{border:0;background:transparent;color:#fff;font-size:14px;font-weight:600;padding:7px 12px;border-radius:8px;cursor:pointer}
  .seg button.on{background:#fff;color:var(--main-d)}
  .hbtn{border:0;background:rgba(255,255,255,.22);color:#fff;border-radius:8px;padding:4px 10px;font-size:12.5px;font-weight:600;cursor:pointer}
  .ptop{display:flex;align-items:center;gap:8px;margin:0 0 10px;background:rgba(255,255,255,.14);border-radius:10px;padding:7px 8px 7px 12px}
  .ptop .pnow{flex:1;font-size:15px;font-weight:700}
  .ptop button{border:0;background:#fff;color:var(--main-d);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer}

  /* 첫 화면 */
  .home{position:fixed;inset:0;z-index:25;background:#F7F1E8;color:#3A1C0E;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));text-align:center}
  .home[hidden]{display:none}
  .home .logo{width:150px;height:auto;margin-bottom:22px}
  .home h1{margin:0 0 6px;font-size:23px;font-weight:800;letter-spacing:-.02em;color:#612D16}
  .home p{margin:0 0 30px;font-size:15px;color:#7A5A48}
  .home-places{display:flex;flex-direction:column;gap:12px;width:100%;max-width:360px}
  .home-places button{position:relative;border:2px solid #612D16;background:#fff;color:#612D16;border-radius:16px;padding:22px 16px;font-size:22px;font-weight:800;cursor:pointer}
  .home-places button:active{background:#612D16;color:#fff}
  .home-places button small{display:block;font-size:12.5px;font-weight:600;color:#9A7B66;margin-top:4px}
  .home-foot{margin-top:28px;font-size:12.5px;color:#9A7B66}
  body.stock .ptop{display:none}
  .toast{z-index:40}
  .sq2{flex:none;display:flex;gap:14px;text-align:right;font-variant-numeric:tabular-nums}
  .sq2 div{min-width:48px}
  .sq2 .pl{display:block;font-size:11.5px;color:var(--sub);font-weight:500}
  .sq2 b{font-size:18px}.sq2 small{font-size:12px;color:var(--sub);margin-left:1px}
  .sq2 .zero b{color:var(--red)}.sq2 .none{font-size:12px;color:var(--sub)}
  .placeline{font-size:14px;color:var(--sub);margin:-2px 0 12px}.placeline b{color:var(--ink);font-size:15px}
  .srow{display:flex;gap:8px}
  .scanbtn{flex:none;white-space:nowrap;border:0;border-radius:10px;background:#fff;color:var(--main-d);font-weight:700;font-size:15px;padding:0 14px;cursor:pointer}
  .scan{position:fixed;inset:0;z-index:30;background:#0E1411;color:#fff;display:flex;flex-direction:column;
    padding:calc(12px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom))}
  .scan[hidden]{display:none}
  .scan-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .scan-top b{font-size:18px}.scan-top span{flex:1;font-size:13px;opacity:.75}
  .scan-top button{border:0;border-radius:10px;background:#fff;color:#0E1411;font-weight:700;font-size:15px;padding:9px 16px;cursor:pointer}
  #reader{width:100%;max-width:520px;margin:0 auto;border-radius:14px;overflow:hidden;background:#000;min-height:220px}
  #reader video{width:100% !important;height:auto !important;display:block}
  .scan-ctl{display:flex;align-items:center;gap:8px;max-width:520px;width:100%;margin:10px auto 0;flex-wrap:wrap}
  .scan-ctl button{border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:10px;padding:8px 12px;font-size:13.5px;font-weight:600;cursor:pointer}
  .scan-ctl button.on{background:#fff;color:#0E1411}
  .scan-ctl button[hidden],.scan-ctl label[hidden]{display:none}
  .scan-ctl label{flex:1;display:flex;align-items:center;gap:8px;font-size:13px;min-width:150px}
  .scan-ctl input[type=range]{flex:1;accent-color:#9BE3B8}
  .scan-msg{text-align:center;font-size:14.5px;margin:12px 0;min-height:22px;line-height:1.5}
  .scan-msg.bad{color:#FFB199}.scan-msg.good{color:#9BE3B8}
  .scan-card{background:#fff;color:var(--ink);border-radius:14px;padding:14px;max-width:520px;width:100%;margin:0 auto}
  .scan-card[hidden]{display:none}
  .scan-card .name{font-size:17px}
  .scan-card .qrow{display:flex;align-items:center;justify-content:space-between;margin:12px 0 4px}
  .scan-card .qrow .step button{width:52px;height:48px;font-size:24px}
  .scan-card .qrow .step input{width:64px;height:48px;font-size:19px;font-weight:700}
  .scan-foot{margin-top:auto;text-align:center;font-size:14px;opacity:.85;padding-top:10px}
  .toast{z-index:40 !important}
  .search{width:100%;border:0;border-radius:10px;padding:12px;font-size:16px;color:var(--ink)}

  main{padding:10px 12px 120px;max-width:640px;margin:0 auto}
  body.stock main{padding-bottom:30px}
  .msg{text-align:center;color:var(--sub);font-size:14px;padding:40px 10px;line-height:1.6}
  .item{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
  .item.on{border-color:var(--main);box-shadow:inset 4px 0 0 var(--main)}
  .info{flex:1;min-width:0}
  .name{font-size:15.5px;font-weight:600;line-height:1.35}
  .meta{font-size:12.5px;color:var(--sub);margin-top:3px}
  .meta .warn{color:var(--red);font-weight:600}
  .step{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
  .step button{width:40px;height:40px;border:0;background:#F5F8F5;font-size:21px;color:var(--main-d);cursor:pointer}
  .step input{width:46px;height:40px;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);text-align:center;font-size:16px;color:var(--ink);-moz-appearance:textfield}
  .step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .sq{flex:none;text-align:right;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
  .sq small{font-size:13px;font-weight:500;color:var(--sub);margin-left:2px}
  .sq.zero{color:var(--red)}
  .sq.none{font-size:13px;font-weight:500;color:var(--sub)}

  .bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:12px;align-items:center}
  body.stock .bar{display:none}
  .bar .sum{flex:1;font-size:13.5px;color:var(--sub)}
  .bar .clr{padding:14px 14px;color:var(--red);border-color:#E9C9BA}
  .bar .clr[hidden]{display:none}
  .bar .sum b{display:block;color:var(--ink);font-size:17px}
  .btn{border:0;border-radius:12px;background:var(--main);color:#fff;font-size:16px;font-weight:600;padding:14px 22px;cursor:pointer}
  .btn:disabled{background:#AEB9B1;cursor:default}
  .btn.full{width:100%;margin-top:6px}
  .btn.line{background:#fff;color:var(--main-d);border:1px solid var(--line)}
  .btn.danger{background:#fff;color:var(--red);border:1px solid #E9C9BA}
  .btnrow{display:flex;gap:8px;margin-top:6px}.btnrow .btn{flex:1;padding:13px 10px}

  .overlay{position:fixed;inset:0;background:rgba(23,33,27,.45);z-index:10;display:none}
  .overlay.show{display:block}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;max-height:92vh;overflow-y:auto;background:var(--bg);border-radius:18px 18px 0 0;
    padding:18px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .22s ease;max-width:640px;margin:0 auto}
  .sheet.show{transform:none}
  .sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .sheet-head h2{margin:0;font-size:18px}
  .x{border:0;background:none;font-size:15px;color:var(--sub);padding:8px;cursor:pointer}
  .banner{background:#FFF6DE;border:1px solid #F0DDA6;border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.5;margin-bottom:12px}
  .banner button{border:0;background:none;color:var(--red);font-weight:600;padding:0;margin-left:4px;font-size:13.5px;cursor:pointer}

  .box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px 12px;margin-bottom:14px}
  .crow{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
  .crow:last-child{border-bottom:0}
  .crow .n{flex:1;font-size:14.5px}
  .crow .q{font-weight:700;font-size:15px}
  .crow .rm{border:0;background:none;color:var(--red);font-size:13px;padding:6px;cursor:pointer}

  .field{margin-bottom:14px}
  .field label,.field .lb{display:block;font-size:13.5px;font-weight:600;margin-bottom:6px}
  .field small{font-weight:400;color:var(--sub)}
  .req{color:var(--red);margin-left:2px}
  .field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px;background:#fff;color:var(--ink)}
  .field textarea{resize:vertical;min-height:60px}
  .two{display:flex;gap:10px}.two .field{flex:1;min-width:0}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px;font-size:14px;color:var(--ink);cursor:pointer}
  .chip.on{background:var(--main);border-color:var(--main);color:#fff}
  .chips.big .chip{flex:1;border-radius:10px;padding:12px;font-size:15px;font-weight:600}
  .amt{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:-4px 0 14px}
  .amt .row1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .amt .lbl{font-size:13px;color:var(--sub)}
  .amt .won{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
  .appr{display:inline-block;border-radius:8px;padding:4px 10px;font-size:13.5px;font-weight:700;margin-top:8px}
  .appr.a0{background:#E3F1E8;color:#1E4D38}.appr.a1{background:#FFF1CC;color:#7A5300}
  .appr.a2{background:#FFE1CC;color:#8A3A00}.appr.a3{background:#FBD5D5;color:#8E1B1B}
  .amt .note{font-size:12.5px;color:var(--sub);margin-top:6px;line-height:1.5}
  .crow .lp{display:block;font-size:12px;color:var(--sub)}
  .err{color:var(--red);font-size:13.5px;min-height:18px;margin:4px 0}

  .done{text-align:center;padding:20px 4px 4px}
  .done .big{font-size:40px;line-height:1;color:var(--main)}
  .done h2{margin:12px 0 6px;font-size:19px}
  .done p{margin:0 0 16px;color:var(--sub);font-size:14px;line-height:1.6}
  .hint{font-size:12.5px;color:var(--sub);text-align:center;margin-top:10px}

  .rec{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
  .rec .top{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--sub)}
  .tag{display:inline-block;border-radius:6px;padding:2px 7px;font-size:12px;font-weight:700;color:#fff;background:var(--green);margin-right:6px}
  .tag.in{background:#2F5A8A}
  .rec .body{font-size:14.5px;margin:6px 0 10px;line-height:1.5}
  .rec .btnrow .btn{padding:10px;font-size:14.5px}

  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#17211B;color:#fff;padding:11px 16px;border-radius:10px;font-size:14px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
  .toast.show{opacity:1}
  @media (prefers-reduced-motion:reduce){.sheet,.toast{transition:none}}
</style>
</head>

  <h1>샘플 출고·입고 관리</h1>
  <p>지금 계신 장소를 선택하세요</p>
  <div class="home-places" id="homePlaces"></div>
  <div class="home-foot">장소는 목록 화면 위쪽에서 언제든 바꿀 수 있어요</div>
</section>

<header>
  <div class="htop">
    <h1 id="title">샘플 출고</h1>
    <div class="seg" role="group" aria-label="화면 선택">
      <button type="button" class="on" data-mode="out">출고</button>
      <button type="button" data-mode="in">입고</button>
      <button type="button" data-mode="stock">재고</button>
    </div>
  </div>
  <p id="subtitle"></p>
  <div class="ptop" id="ptop"></div>
  <div class="srow">
    <input id="q" class="search" type="search" placeholder="제품명·바코드 검색" autocomplete="off" enterkeyhint="search">
    <button type="button" class="scanbtn" id="scanBtn" aria-label="바코드 스캔">📷 바코드 스캔</button>
  </div>
</header>

<main id="list"><div class="msg">샘플 목록을 불러오는 중…</div></main>

<div class="bar">
  <div class="sum" id="sum"></div>
  <button class="btn line clr" id="clearCart" hidden>비우기</button>
  <button class="btn" id="openCart" disabled>담은 목록 보기</button>
</div>

<div class="overlay" id="overlay"></div>
<section class="sheet" id="sheet" aria-label="등록">
  <div id="formView">
    <div class="sheet-head"><h2 id="sheetTitle">출고 등록</h2><div><button class="x" data-act="clearAll" style="color:var(--red)">전체 비우기</button><button class="x" data-act="close">닫기</button></div></div>
    <div id="editBanner"></div>
    <div class="box" id="cartBox"></div>
    <div class="amt" id="amtBox"></div>
    <div class="two">
      <div class="field"><label for="user">담당자<span class="req">*</span></label><input id="user" autocomplete="name"></div>
      <div class="field"><label for="dept">부서<span class="req">*</span></label><input id="dept"></div>
    </div>
    <div class="placeline" id="placeLine"></div>
    <div class="field"><span class="lb" id="purposeLabel">사용 구분<span class="req">*</span></span><div class="chips" id="chips"></div></div>
    <div class="field"><label for="client" id="clientLabel">제공처 <small>고객사·행사명 등</small></label><input id="client"></div>
    <div class="field"><label for="memo">비고 <small>선택</small></label><textarea id="memo"></textarea></div>
    <div class="err" id="err"></div>
    <button class="btn full" id="submit">출고 등록</button>
  </div>

  <div id="doneView" hidden>
    <div class="done">
      <div class="big">✓</div>
      <h2 id="doneTitle"></h2>
      <p id="doneText"></p>
      <div class="btnrow">
        <button class="btn line" data-act="editLast">수정</button>
        <button class="btn danger" data-act="cancelLast">등록 취소</button>
      </div>
      <button class="btn full" data-act="again">새로 담기</button>
      <div class="hint" id="doneHint"></div>
    </div>
  </div>

  <div id="recentView" hidden>
    <div class="sheet-head"><h2>최근 등록 내역</h2><button class="x" data-act="close">닫기</button></div>
    <div id="recentList"></div>
    <div class="hint" id="recentHint"></div>
  </div>
</section>

<div class="scan" id="scan" hidden>
  <div class="scan-top"><b>바코드 스캔</b><span id="scanInfo"></span><button type="button" data-sact="close">완료</button></div>
  <div id="reader"></div>
  <div class="scan-ctl">
    <button type="button" data-sact="switch" id="camSwitch" hidden>카메라 전환</button>
    <button type="button" data-sact="torch" id="camTorch" hidden>플래시</button>
    <label id="zoomWrap" hidden>확대 <input type="range" id="camZoom"></label>
  </div>
  <div class="scan-msg" id="scanMsg">바코드를 네모 칸 안에 맞춰 주세요</div>
  <div class="scan-card" id="scanCard" hidden>
    <div class="name" id="scName"></div>
    <div class="meta" id="scMeta"></div>
    <div class="qrow">
      <span id="scNow" style="font-size:14px;color:var(--sub)"></span>
      <div class="step"><button type="button" data-sact="minus" aria-label="빼기">−</button>
        <input type="number" inputmode="numeric" min="1" id="scQty" aria-label="담을 수량">
        <button type="button" data-sact="plus" aria-label="더하기">+</button></div>
    </div>
    <div class="btnrow"><button type="button" class="btn line" data-sact="skip">다시 스캔</button>
      <button type="button" class="btn" data-sact="add">담기</button></div>
  </div>
  <div class="scan-foot" id="scanFoot"></div>
</div>

<div class="toast" id="toast"></div>

<script>
  // Apps Script 배포 주소 (…/exec). '배포 관리 → 새 버전'으로 재배포하면 주소는 그대로입니다.
  var API = 'https://script.google.com/macros/s/AKfycbz7_-VStBTV5Y2pe3m1mpoTx-GHkZ4JFSa2FTHUMRZAZosYx5xmjT6YI4MjFAFj5qpb1A/exec';

  function unwrap(res) { if (!res.ok) throw new Error(res.error); return res.data; }
  function netErr(e) { return e instanceof TypeError ? new Error('서버에 연결하지 못했습니다. 인터넷 연결을 확인하고 다시 시도하세요.') : e; }
  function apiInit() {
    return fetch(API + '?action=init').then(function (r) { return r.json(); }).then(unwrap).catch(function (e) { throw netErr(e); });
  }
  function apiPost(p) {
    return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(p) })
      .then(function (r) { return r.json(); }).then(unwrap).catch(function (e) { throw netErr(e); });
  }

  var ITEMS = [], PURPOSES = [], IN_PURPOSES = [], PLACES = ['본관', '별관'], LIMIT_MIN = 1440;
  var cart = {}, purpose = '', place = '', mode = 'out', lastLoaded = null, editing = null, lastDone = null;
  var $ = function (s) { return document.querySelector(s); };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function byId(id) { for (var i = 0; i < ITEMS.length; i++) if (ITEMS[i].id === id) return ITEMS[i]; }
  var APPROVAL = [{ under: 300000, label: '팀장 전결' }, { under: 700000, label: '총괄/실장 전결' },
                  { under: 5000000, label: 'CFO 전결' }, { under: null, label: 'CEO' }];
  var DRAFT_MIN = 300000;
  function needDraft(amt) { return mode === 'out' && amt >= DRAFT_MIN; }
  function won(n) { return Math.round(n).toLocaleString('ko-KR') + '원'; }
  function approvalIdx(a) { for (var i = 0; i < APPROVAL.length; i++) if (APPROVAL[i].under === null || a < APPROVAL[i].under) return i; return APPROVAL.length - 1; }
  function cartAmount() {
    var amt = 0, noPrice = 0;
    Object.keys(cart).forEach(function (id) { var it = byId(id); if (!it) return; if (it.price === '' || it.price == null) noPrice++; else amt += it.price * cart[id]; });
    return { amt: amt, noPrice: noPrice };
  }
  function word() { return mode === 'in' ? '입고' : '출고'; }
  function pad(n) { return ('0' + n).slice(-2); }
  function hhmm(d, sec) { return pad(d.getHours()) + ':' + pad(d.getMinutes()) + (sec ? ':' + pad(d.getSeconds()) : ''); }
  function toast(t) { var el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(function () { el.classList.remove('show'); }, 2600); }
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

  /* 최근 등록 (이 기기에만 저장) */
  function getRecent() {
    var a; try { a = JSON.parse(store('smp_recent') || '[]'); } catch (e) { a = []; }
    var now = Date.now();
    return a.filter(function (r) { return now - r.at < LIMIT_MIN * 60000; });
  }
  function setRecent(a) { store('smp_recent', JSON.stringify(a.slice(0, 20))); }
  function addRecent(r) { var a = getRecent().filter(function (x) { return x.reqNo !== r.reqNo; }); a.unshift(r); setRecent(a); }
  function removeRecent(no) { setRecent(getRecent().filter(function (x) { return x.reqNo !== no; })); }
  function minsLeft(r) { return Math.max(0, Math.ceil((LIMIT_MIN * 60000 - (Date.now() - r.at)) / 60000)); }
  function dur(min) {
    var h = Math.floor(min / 60), m = min % 60;
    return h && m ? h + '시간 ' + m + '분' : h ? h + '시간' : m + '분';
  }
  function when(ms) {
    var d = new Date(ms), now = new Date();
    return (d.toDateString() === now.toDateString() ? '오늘 ' : (d.getMonth() + 1) + '/' + d.getDate() + ' ') + hhmm(d);
  }
  function summary(r) {
    var f = r.items[0], more = r.items.length - 1;
    return esc(f.name) + ' ' + f.qty + esc(f.unit) + (more > 0 ? ' 외 ' + more + '건' : '');
  }

  /* 불러오기 */
  function load() {
    return apiInit().then(function (d) {
      ITEMS = d.items.sort(function (a, b) { return a.name.localeCompare(b.name, 'ko', { numeric: true }); }); PURPOSES = d.purposes; IN_PURPOSES = d.inPurposes || []; PLACES = d.places || PLACES;
      if (d.editLimitMin) LIMIT_MIN = d.editLimitMin;
      if (d.approval && d.approval.length) APPROVAL = d.approval;
      if (d.draftMin) DRAFT_MIN = d.draftMin;
      lastLoaded = new Date();
      renderSub(); renderList(); renderChips();
    }).catch(function (e) {
      $('#list').innerHTML = '<div class="msg">목록을 불러오지 못했습니다.<br>' + esc(e.message) + '</div>';
    });
  }

  /* 헤더 */
  function renderSub() {
    var el = $('#subtitle');
    if (mode === 'stock') {
      el.innerHTML = '<span>' + (lastLoaded ? hhmm(lastLoaded, true) + ' 기준 · 30초마다 자동 갱신' : '불러오는 중…') + '</span>' +
        '<button type="button" class="hbtn" data-act="refresh">새로고침</button>';
      return;
    }
    var n = getRecent().length;
    el.innerHTML = '<span>' + (mode === 'in' ? '들어온 샘플을 담고 한 번에 등록하세요' : '필요한 샘플을 담고 한 번에 등록하세요') + '</span>' +
      (n ? '<button type="button" class="hbtn" data-act="recent">최근 등록 ' + n + '건</button>' : '');
  }

  /* 목록 */
  function st(it, p) { var v = it.stock && it.stock[p]; return v === undefined ? '' : v; }
  function avail(it) {
    var s = st(it, place);
    if (s === '') return '';
    if (editing && editing.type === 'out' && editing.place === place) editing.items.forEach(function (x) { if (x.id === it.id) s += x.qty; });
    return s;
  }
  function stockText(it, qty) {
    if (!place) return '장소를 먼저 선택하세요';
    var s = st(it, place);
    if (s === '') return place + ' 재고 미관리';
    var t = place + ' 재고 ' + s + esc(it.unit);
    return (mode === 'out' && qty > avail(it)) ? '<span class="warn">' + t + ' · 부족(마이너스 출고)</span>' : t;
  }
  function renderList() {
    var q = $('#q').value.trim().toLowerCase();
    var list = ITEMS.filter(function (it) { return !q || (it.name + ' ' + it.id + ' ' + it.spec + ' ' + (it.codes || []).join(' ')).toLowerCase().indexOf(q) > -1; });
    if (!ITEMS.length) { $('#list').innerHTML = '<div class="msg">등록된 샘플이 없습니다.<br>시트의 샘플목록 탭에 품목을 추가하세요.</div>'; return; }
    if (!list.length) { $('#list').innerHTML = '<div class="msg">‘' + esc(q) + '’와 일치하는 샘플이 없습니다.</div>'; return; }
    if (mode === 'stock') {
      $('#list').innerHTML = list.map(function (it) {
        var sq = '<div class="sq2">' + PLACES.map(function (p) {
          var s = st(it, p);
          return s === '' ? '<div><span class="pl">' + esc(p) + '</span><span class="none">미관리</span></div>'
            : '<div class="' + (s <= 0 ? 'zero' : '') + '"><span class="pl">' + esc(p) + '</span><b>' + esc(s) + '</b><small>' + esc(it.unit) + '</small></div>';
        }).join('') + '</div>';
        return '<div class="item"><div class="info"><div class="name">' + esc(it.name) + '</div><div class="meta">' +
          esc(it.spec) + (it.spec ? ' · ' : '') + esc(it.id) + '</div></div>' + sq + '</div>';
      }).join('');
      return;
    }
    $('#list').innerHTML = list.map(function (it) {
      var qty = cart[it.id] || 0;
      return '<div class="item' + (qty ? ' on' : '') + '" data-id="' + esc(it.id) + '">' +
        '<div class="info"><div class="name">' + esc(it.name) + '</div>' +
        '<div class="meta">' + esc(it.spec) + (it.spec ? ' · ' : '') + (it.price !== '' && it.price != null ? won(it.price) + ' · ' : '') +
        '<span class="st">' + stockText(it, qty) + '</span></div></div>' +
        '<div class="step"><button type="button" data-d="-1" aria-label="빼기">−</button>' +
        '<input type="number" inputmode="numeric" min="0" value="' + (qty || '') + '" placeholder="0" aria-label="수량">' +
        '<button type="button" data-d="1" aria-label="더하기">+</button></div></div>';
    }).join('');
  }
  function setQty(id, v) {
    v = Math.max(0, parseInt(v, 10) || 0);
    if (v) cart[id] = v; else delete cart[id];
    var row = document.querySelector('.item[data-id="' + CSS.escape(id) + '"]');
    if (row) {
      row.classList.toggle('on', v > 0);
      var inp = row.querySelector('input');
      if (document.activeElement !== inp) inp.value = v || '';
      row.querySelector('.st').innerHTML = stockText(byId(id), v);
    }
    updateBar();
  }
  function updateBar() {
    var ids = Object.keys(cart), total = 0;
    ids.forEach(function (id) { total += cart[id]; });
    var pre = editing ? '수정 중 · ' : '';
    $('#sum').innerHTML = ids.length
      ? '<b>' + pre + ids.length + '개 품목 · 총 ' + total + '개</b>' + barAmount()
      : '<b>' + (editing ? '수정 중 · ' : '') + '담긴 샘플 없음</b>수량을 눌러 담아 주세요';
    $('#openCart').disabled = !ids.length;
    $('#clearCart').hidden = !ids.length;
  }
  function barAmount() {
    var c = cartAmount();
    var s = '<span style="color:var(--ink);font-weight:700">' + won(c.amt) + '</span>';
    if (mode === 'out') s += ' · ' + esc(APPROVAL[approvalIdx(c.amt)].label) + (needDraft(c.amt) ? ' · <span style="color:var(--red);font-weight:700">기안 필요</span>' : '');
    return s;
  }
  function renderAmount() {
    var c = cartAmount(), i = approvalIdx(c.amt);
    var html = '<div class="row1"><span class="lbl">합계 금액 (판매가 기준)</span><span class="won">' + won(c.amt) + '</span></div>';
    if (mode === 'out') {
      html += '<span class="appr a' + Math.min(i, 3) + '">' + esc(APPROVAL[i].label) + '</span>' +
        (needDraft(c.amt)
          ? '<div class="note" style="color:var(--ink)"><b>' + won(DRAFT_MIN) + ' 이상은 별도 기안 승인 후 신청</b>해야 해요. 기안 승인을 받으셨는지 확인해 주세요.</div>'
          : '<div class="note">' + won(DRAFT_MIN) + ' 미만이라 샘플신청서로 진행돼요.</div>');
    }
    if (c.noPrice) html += '<div class="note" style="color:var(--red)">판매가가 입력되지 않은 ' + c.noPrice + '개 품목은 합계에서 빠졌어요.</div>';
    $('#amtBox').innerHTML = html;
  }
  function clearCart() {
    var n = Object.keys(cart).length; if (!n) return false;
    if (!confirm('담은 ' + n + '개 품목의 수량을 모두 비울까요?')) return false;
    cart = {}; renderList(); updateBar(); toast('장바구니를 비웠어요.');
    return true;
  }

  /* 선택 칩 */
  function chipHtml(list, sel, attr) {
    return list.map(function (p) {
      return '<button type="button" class="chip' + (p === sel ? ' on' : '') + '" ' + attr + '="' + esc(p) + '">' + esc(p) + '</button>';
    }).join('');
  }
  function renderChips() {
    $('#chips').innerHTML = chipHtml(mode === 'in' ? IN_PURPOSES : PURPOSES, purpose, 'data-p');
    renderPlaces();
  }
  function renderPlaces() {
    $('#ptop').innerHTML = '<span class="pnow">📍 ' + (place ? esc(place) : '장소 미선택') + '</span>' +
      '<button type="button" data-act="home">장소 변경</button>';
    $('#placeLine').innerHTML = place ? '장소 <b>' + esc(place) + '</b> · 바꾸려면 목록 화면 위 "장소 변경"을 누르세요' : '';
    $('#homePlaces').innerHTML = PLACES.map(function (p) {
      return '<button type="button" data-hp="' + esc(p) + '">' + esc(p) + (p === place ? '<small>최근 선택</small>' : '') + '</button>';
    }).join('');
  }
  function showHomeRaw() { renderPlaces(); $('#home').hidden = false; }
  function showHome() { if (topLayer() === 'list') history.back(); else showHomeRaw(); }
  $('#home').addEventListener('click', function (e) {
    var b = e.target.closest('[data-hp]'); if (!b) return;
    setPlace(b.dataset.hp); $('#home').hidden = true; window.scrollTo(0, 0);
    pushLayer('list');
  });
  function setPlace(p) {
    if (PLACES.indexOf(p) < 0) return;
    place = p; store('smp_place', p);
    renderPlaces(); renderList();
  }

  /* 시트(아래에서 올라오는 창) */
  function showView(v) {
    $('#formView').hidden = v !== 'form'; $('#doneView').hidden = v !== 'done'; $('#recentView').hidden = v !== 'recent';
    $('#overlay').classList.add('show'); $('#sheet').classList.add('show'); $('#sheet').scrollTop = 0;
    pushLayer('sheet');
  }
  function closeSheetRaw() { $('#overlay').classList.remove('show'); $('#sheet').classList.remove('show'); }
  function closeSheet() { if (topLayer() === 'sheet') history.back(); else closeSheetRaw(); }
  function renderCart() {
    $('#cartBox').innerHTML = Object.keys(cart).map(function (id) {
      var it = byId(id);
      var lp = it.price !== '' && it.price != null ? '<span class="lp">' + won(it.price) + ' × ' + cart[id] + ' = ' + won(it.price * cart[id]) + '</span>' : '<span class="lp">판매가 미입력</span>';
      return '<div class="crow"><span class="n">' + esc(it.name) + (it.spec ? ' <small style="color:var(--sub)">' + esc(it.spec) + '</small>' : '') + lp +
        '</span><span class="q">' + cart[id] + esc(it.unit) + '</span><button class="rm" data-rm="' + esc(id) + '">빼기</button></div>';
    }).join('');
    renderAmount();
    $('#editBanner').innerHTML = editing
      ? '<div class="banner">요청번호 <b>' + esc(editing.reqNo) + '</b> 수정 중이에요. 등록하면 기존 내역은 자동으로 취소 처리돼요.' +
        '<button type="button" data-act="stopEdit">수정 그만두기</button></div>' : '';
  }
  function openForm() { renderCart(); $('#err').textContent = ''; showView('form'); }

  function setMode(m) {
    mode = m; purpose = '';
    document.body.classList.toggle('in', m === 'in');
    document.body.classList.toggle('stock', m === 'stock');
    document.querySelectorAll('.seg button').forEach(function (b) { b.classList.toggle('on', b.dataset.mode === m); });
    var w = word();
    $('#title').textContent = m === 'stock' ? '샘플 재고' : '샘플 ' + w;
    $('#sheetTitle').textContent = (editing ? w + ' 수정' : w + ' 등록');
    $('#submit').textContent = editing ? '수정 내용 등록' : w + ' 등록';
    $('#purposeLabel').innerHTML = (m === 'in' ? '입고 구분' : '사용 구분') + '<span class="req">*</span>';
    $('#clientLabel').innerHTML = m === 'in' ? '입고처 <small>공급처·반납자 등</small>' : '제공처 <small>고객사·행사명 등</small>';
    renderSub(); renderChips(); renderList(); updateBar();
    if (m === 'stock') load();
  }

  /* 최근 등록 · 수정 · 취소 */
  function renderRecent() {
    var a = getRecent();
    $('#recentList').innerHTML = a.length ? a.map(function (r) {
      return '<div class="rec"><div class="top"><span><span class="tag' + (r.type === 'in' ? ' in' : '') + '">' + (r.type === 'in' ? '입고' : '출고') +
        '</span>' + when(r.at) + ' · ' + esc(r.place) + ' · ' + esc(r.purpose) + '</span><span>' + dur(minsLeft(r)) + ' 남음</span></div>' +
        '<div class="body">' + summary(r) + '</div>' +
        '<div class="btnrow"><button class="btn line" data-edit="' + esc(r.reqNo) + '">수정</button>' +
        '<button class="btn danger" data-cancel="' + esc(r.reqNo) + '">취소</button></div></div>';
    }).join('') : '<div class="msg">수정·취소할 수 있는 최근 등록이 없습니다.</div>';
    $('#recentHint').textContent = '이 기기에서 등록한 건만, 등록 후 ' + dur(LIMIT_MIN) + ' 안에 수정·취소할 수 있어요.';
  }
  function findRecent(no) { return getRecent().filter(function (x) { return x.reqNo === no; })[0]; }

  function startEdit(r) {
    if (!r) { toast('수정 가능 시간이 지났어요.'); return; }
    editing = r;
    setMode(r.type === 'in' ? 'in' : 'out');
    purpose = r.purpose; place = r.place; store('smp_place', place);
    cart = {};
    var missing = 0;
    r.items.forEach(function (it) { if (byId(it.id)) cart[it.id] = it.qty; else missing++; });
    $('#user').value = r.user; $('#dept').value = r.dept; $('#client').value = r.client || ''; $('#memo').value = r.memo || '';
    renderChips(); renderList(); updateBar(); openForm();
    if (missing) toast('목록에서 빠진 품목 ' + missing + '개는 제외됐어요.');
  }
  function stopEdit() {
    editing = null; cart = {}; purpose = ''; $('#client').value = ''; $('#memo').value = '';
    setMode(mode); updateBar(); closeSheet();
  }
  function doCancel(r) {
    if (!r) { toast('취소 가능 시간이 지났어요.'); return; }
    if (!confirm('요청번호 ' + r.reqNo + '(' + summary(r).replace(/<[^>]+>/g, '') + ')을 취소할까요?\n재고가 등록 전으로 돌아갑니다.')) return;
    apiPost({ action: 'cancel', reqNo: r.reqNo, token: r.token }).then(function () {
      removeRecent(r.reqNo);
      if (lastDone && lastDone.reqNo === r.reqNo) lastDone = null;
      closeSheet(); toast('등록이 취소됐어요.'); renderSub(); load();
    }).catch(function (e) { alert(String(e.message || e).replace(/^Error:\s*/, '')); });
  }

  /* 이벤트 */
  $('#list').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-d]'); if (!b) return;
    if (!place) { toast('먼저 위에서 장소(본관/별관)를 선택하세요.'); return; }
    var id = b.closest('.item').dataset.id;
    setQty(id, (cart[id] || 0) + Number(b.dataset.d));
  });
  $('#list').addEventListener('input', function (e) {
    if (e.target.tagName !== 'INPUT') return;
    if (!place) { e.target.value = ''; toast('먼저 위에서 장소(본관/별관)를 선택하세요.'); return; }
    setQty(e.target.closest('.item').dataset.id, e.target.value);
  });
  $('#q').addEventListener('input', renderList);
  document.querySelector('.seg').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-mode]'); if (!b || b.dataset.mode === mode) return;
    if (editing) { editing = null; cart = {}; updateBar(); toast('수정을 그만뒀어요.'); }
    setMode(b.dataset.mode);
  });
  $('header').addEventListener('click', function (e) {
    var a = e.target.dataset && e.target.dataset.act;
    if (a === 'home') showHome();
    if (a === 'refresh') { e.target.textContent = '갱신 중…'; load(); }
    if (a === 'recent') { renderRecent(); showView('recent'); }
  });
  $('#openCart').addEventListener('click', openForm);
  $('#clearCart').addEventListener('click', clearCart);
  $('#overlay').addEventListener('click', closeSheet);

  $('#sheet').addEventListener('click', function (e) {
    var t = e.target.closest('[data-act],[data-rm],[data-p],[data-pl],[data-edit],[data-cancel]'); if (!t) return;
    var d = t.dataset;
    if (d.rm) { setQty(d.rm, 0); if (!Object.keys(cart).length) closeSheet(); else renderCart(); }
    else if (d.p) { purpose = d.p; renderChips(); }
    else if (d.pl) { place = d.pl; renderChips(); }
    else if (d.edit) startEdit(findRecent(d.edit));
    else if (d.cancel) doCancel(findRecent(d.cancel));
    else if (d.act === 'close') closeSheet();
    else if (d.act === 'clearAll') { if (clearCart()) closeSheet(); }
    else if (d.act === 'stopEdit') stopEdit();
    else if (d.act === 'again') { closeSheet(); window.scrollTo(0, 0); }
    else if (d.act === 'editLast') startEdit(lastDone && findRecent(lastDone.reqNo));
    else if (d.act === 'cancelLast') doCancel(lastDone && findRecent(lastDone.reqNo));
  });

  // 담당자·부서·장소는 다음에 자동으로 채움
  $('#user').value = store('smp_user') || '';
  $('#dept').value = store('smp_dept') || '';
  place = store('smp_place') || '';

  $('#submit').addEventListener('click', function () {
    var user = $('#user').value.trim(), dept = $('#dept').value.trim();
    var err = !user ? '담당자 이름을 입력하세요.' : !dept ? '부서를 입력하세요.' : !place ? '화면 위에서 장소(본관/별관)를 선택하세요.'
      : !purpose ? (mode === 'in' ? '입고' : '사용') + ' 구분을 선택하세요.' : '';
    if (err) { $('#err').textContent = err; return; }

    var ids = Object.keys(cart);
    var payload = {
      type: mode, user: user, dept: dept, place: place, purpose: purpose,
      client: $('#client').value.trim(), memo: $('#memo').value.trim(),
      items: ids.map(function (id) { return { id: id, qty: cart[id] }; })
    };
    var wasEdit = editing;
    if (wasEdit) { payload.replaceReqNo = wasEdit.reqNo; payload.replaceToken = wasEdit.token; }
    store('smp_user', user); store('smp_dept', dept); store('smp_place', place);

    var btn = $('#submit'), label = btn.textContent;
    btn.disabled = true; btn.textContent = '등록하는 중…'; $('#err').textContent = '';
    apiPost(payload).then(function (r) {
      btn.disabled = false;
      var rec = { reqNo: r.reqNo, token: r.token, at: Date.now(), type: mode, user: user, dept: dept, place: place, purpose: purpose,
        client: payload.client, memo: payload.memo,
        items: ids.map(function (id) { var it = byId(id); return { id: id, qty: cart[id], name: it.name, unit: it.unit }; }) };
      if (wasEdit) removeRecent(wasEdit.reqNo);
      addRecent(rec); lastDone = rec; editing = null;
      $('#doneTitle').textContent = wasEdit ? '수정됐어요' : word() + '가 등록됐어요';
      $('#doneText').innerHTML = esc(place) + ' · ' + esc(r.count) + '개 품목, 총 ' + esc(r.total) + '개' +
        (r.amount != null ? '<br>판매가 합계 ' + won(r.amount) + (r.approval ? ' · ' + esc(r.approval) : '') : '') +
        '<br>요청번호 ' + esc(r.reqNo);
      $('#doneHint').textContent = '잘못 등록했다면 ' + dur(LIMIT_MIN) + ' 안에 수정하거나 취소할 수 있어요.';
      cart = {}; purpose = ''; $('#client').value = ''; $('#memo').value = '';
      setMode(mode); updateBar(); showView('done'); load();
    }).catch(function (e) {
      btn.disabled = false; btn.textContent = label;
      $('#err').textContent = String(e.message || e).replace(/^Error:\s*/, '');
    });
  });

  /* ---------- 바코드 ---------- */
  function norm(s) { s = String(s || '').trim(); return /^\d+$/.test(s) ? s.replace(/^0+/, '') : s.toUpperCase(); }
  function findByCode(code) {
    var k = norm(code); if (!k) return null;
    for (var i = 0; i < ITEMS.length; i++) {
      var it = ITEMS[i];
      if (norm(it.id) === k) return it;
      var cs = it.codes || [];
      for (var j = 0; j < cs.length; j++) if (norm(cs[j]) === k) return it;
    }
    return null;
  }
  function beep(ok) { try { if (navigator.vibrate) navigator.vibrate(ok ? 60 : [120, 60, 120]); } catch (e) {} }

  // 블루투스·USB 바코드 스캐너(키보드처럼 입력 후 Enter) 지원
  $('#q').addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    var it = findByCode(this.value); if (!it) return;
    e.preventDefault();
    if (mode === 'stock') { this.value = it.id; renderList(); return; }
    if (!place) { toast('먼저 위에서 장소(본관/별관)를 선택하세요.'); return; }
    setQty(it.id, (cart[it.id] || 0) + 1);
    toast(it.name + ' 1' + it.unit + ' 담았어요 (총 ' + cart[it.id] + it.unit + ')');
    beep(true); this.value = ''; renderList();
  });

  var scanner = null, scanBusy = false, scanItem = null, lastCode = '', lastAt = 0, scanAdded = 0;
  function scanFoot() {
    var ids = Object.keys(cart), total = 0; ids.forEach(function (id) { total += cart[id]; });
    $('#scanFoot').textContent = mode === 'stock' ? '찍으면 해당 품목의 재고를 보여 드려요'
      : '장바구니 ' + ids.length + '개 품목 · 총 ' + total + '개' + (scanAdded ? ' (이번 스캔 ' + scanAdded + '건)' : '');
  }
  function scanMsg(t, cls) { var el = $('#scanMsg'); el.textContent = t; el.className = 'scan-msg' + (cls ? ' ' + cls : ''); }
  function openScanner() {
    if (mode !== 'stock' && !place) { toast('먼저 위에서 장소(본관/별관)를 선택하세요.'); return; }
    if (typeof Html5Qrcode === 'undefined') { toast('스캔 기능을 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.'); return; }
    scanBusy = false; scanItem = null; scanAdded = 0; lastCode = '';
    $('#scan').hidden = false; $('#scanCard').hidden = true;
    $('#scanInfo').textContent = mode === 'stock' ? '재고 확인' : place + ' · ' + word();
    scanMsg('10~20cm 떨어져서 바코드를 네모 칸에 맞춰 주세요'); scanFoot();
    pushLayer('scan');
    startCam();
  }

  var cams = [], torchOn = false;
  function camKey() { return store('smp_cam') || ''; }
  function startCam() {
    var F = Html5QrcodeSupportedFormats;
    scanner = new Html5Qrcode('reader', {
      verbose: false,
      formatsToSupport: [F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.CODE_128, F.CODE_39, F.ITF, F.QR_CODE],
      experimentalFeatures: { useBarCodeDetectorIfSupported: true }
    });
    var id = camKey();
    // 고해상도 + 연속 자동초점 요청 (기본값은 저화질이라 흐릿하게 보임)
    var vc = { width: { ideal: 1920 }, height: { ideal: 1080 }, advanced: [{ focusMode: 'continuous' }] };
    if (id) vc.deviceId = { exact: id }; else vc.facingMode = 'environment';
    scanner.start(id ? { deviceId: { exact: id } } : { facingMode: 'environment' }, {
      fps: 15,
      disableFlip: true,
      videoConstraints: vc,
      qrbox: function (w, h) { return { width: Math.floor(w * 0.9), height: Math.floor(Math.min(h * 0.55, 220)) }; }
    }, onScan, function () {}).then(afterStart).catch(function () {
      if (id) { store('smp_cam', ''); scanner = null; startCam(); return; }   // 저장된 카메라가 안 되면 기본 카메라로
      scanMsg('카메라를 켤 수 없어요. 브라우저에서 카메라 권한을 허용한 뒤 다시 시도해 주세요.', 'bad');
    });
  }
  function afterStart() {
    var caps = {};
    try { caps = scanner.getRunningTrackCapabilities() || {}; } catch (e) {}
    // 확대: 가까이 대면 초점이 안 맞는 폰이 많아서, 약간 떨어져서 확대해 찍는 게 잘 잡혀요
    if (caps.zoom && caps.zoom.max > caps.zoom.min) {
      var z = $('#camZoom'), saved = parseFloat(store('smp_zoom'));
      z.min = caps.zoom.min; z.max = Math.min(caps.zoom.max, 5); z.step = caps.zoom.step || 0.1;
      z.value = saved >= caps.zoom.min && saved <= z.max ? saved : Math.min(2, z.max);
      $('#zoomWrap').hidden = false; applyZoom();
    } else $('#zoomWrap').hidden = true;
    torchOn = false; $('#camTorch').classList.remove('on');
    $('#camTorch').hidden = !caps.torch;
    Html5Qrcode.getCameras().then(function (list) {
      cams = (list || []).filter(function (c) { return !/front|전면|user/i.test(c.label); });
      if (cams.length < 2) cams = list || [];
      $('#camSwitch').hidden = cams.length < 2;
    }).catch(function () {});
  }
  function applyZoom() {
    var v = parseFloat($('#camZoom').value); store('smp_zoom', String(v));
    try { scanner.applyVideoConstraints({ advanced: [{ zoom: v }] }).catch(function () {}); } catch (e) {}
  }
  $('#camZoom').addEventListener('input', applyZoom);
  function switchCam() {
    if (cams.length < 2 || !scanner) return;
    var cur = camKey(), i = -1;
    cams.forEach(function (c, k) { if (c.id === cur) i = k; });
    var next = cams[(i + 1) % cams.length];
    store('smp_cam', next.id);
    var s = scanner; scanner = null;
    s.stop().catch(function () {}).then(function () { try { s.clear(); } catch (e) {} startCam(); });
    scanMsg('카메라를 바꾸는 중… (' + (next.label || '카메라 ' + ((i + 1) % cams.length + 1)) + ')');
  }
  function toggleTorch() {
    if (!scanner) return;
    torchOn = !torchOn; $('#camTorch').classList.toggle('on', torchOn);
    try { scanner.applyVideoConstraints({ advanced: [{ torch: torchOn }] }).catch(function () {}); } catch (e) {}
  }

  function closeScanner() { if (topLayer() === 'scan') history.back(); else closeScannerRaw(); }
  function closeScannerRaw() {
    $('#scan').hidden = true;
    if (scanner) {
      var s = scanner; scanner = null;
      s.stop().catch(function () {}).then(function () { try { s.clear(); } catch (e) {} });
    }
    renderList(); updateBar();
  }
  function onScan(text) {
    if (scanBusy) return;
    var now = Date.now();
    if (text === lastCode && now - lastAt < 2500) return;
    lastCode = text; lastAt = now;
    var it = findByCode(text);
    if (!it) { beep(false); scanMsg('등록되지 않은 바코드예요: ' + text, 'bad'); return; }
    beep(true);
    if (mode === 'stock') { $('#q').value = it.id; closeScanner(); return; }
    scanBusy = true; scanItem = it;
    $('#scName').textContent = it.name;
    $('#scMeta').innerHTML = esc(it.spec) + (it.spec ? ' · ' : '') + stockText(it, cart[it.id] || 0);
    $('#scQty').value = 1; scanNow();
    $('#scanCard').hidden = false; scanMsg('');
  }
  function scanNow() {
    var it = scanItem, have = cart[it.id] || 0, q = Math.max(1, parseInt($('#scQty').value, 10) || 1);
    var a = avail(it), over = mode === 'out' && a !== '' && have + q > a;
    $('#scNow').innerHTML = (have ? '담긴 ' + have + ' → ' : '') + '<b style="color:' + (over ? 'var(--red)' : 'var(--ink)') + '">' + (have + q) + esc(it.unit) + '</b>' +
      (over ? '<br><span style="color:var(--red)">재고 부족 · 마이너스로 출고돼요</span>' : '');
  }
  $('#scQty').addEventListener('input', scanNow);
  $('#scan').addEventListener('click', function (e) {
    var b = e.target.closest('[data-sact]'); if (!b) return;
    var a = b.dataset.sact, q = parseInt($('#scQty').value, 10) || 1;
    if (a === 'close') closeScanner();
    else if (a === 'switch') switchCam();
    else if (a === 'torch') toggleTorch();
    else if (a === 'minus') { $('#scQty').value = Math.max(1, q - 1); scanNow(); }
    else if (a === 'plus') { $('#scQty').value = q + 1; scanNow(); }
    else if (a === 'skip') { $('#scanCard').hidden = true; scanBusy = false; scanMsg('바코드를 네모 칸 안에 맞춰 주세요'); }
    else if (a === 'add') {
      q = Math.max(1, q);
      setQty(scanItem.id, (cart[scanItem.id] || 0) + q);
      scanAdded++;
      scanMsg(scanItem.name + ' ' + q + scanItem.unit + ' 담았어요. 다음 바코드를 찍어 주세요', 'good');
      $('#scanCard').hidden = true; scanBusy = false; lastAt = Date.now(); scanFoot();
    }
  });
  $('#scanBtn').addEventListener('click', openScanner);
  document.addEventListener('visibilitychange', function () { if (document.hidden && scanner) closeScanner(); });

  setInterval(function () { if (mode === 'stock' && !document.hidden) load(); }, 30000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden && mode === 'stock') load(); });

  /* ---------- 뒤로가기: 브라우저를 나가지 않고 이전 화면으로 ----------
     화면 단계: 첫 화면(home) → 목록(list) → 등록창(sheet) / 바코드 스캔(scan)
     첫 화면에서 뒤로가기를 누르면 나갈지 물어봄 */
  var layers = ['home'], histDepth = 0;
  function topLayer() { return layers[layers.length - 1]; }
  function ensureGuard() {
    if (histDepth > 0) return;
    history.replaceState({ d: 0 }, '');
    history.pushState({ d: 1 }, '');
    histDepth = 1;
  }
  function pushLayer(n) {
    if (topLayer() === n) return;
    ensureGuard();
    layers.push(n);
    history.pushState({ d: layers.length }, '');
    histDepth = layers.length;
  }
  function closeLayerRaw(n) {
    if (n === 'scan') closeScannerRaw();
    else if (n === 'sheet') closeSheetRaw();
    else if (n === 'list') showHomeRaw();
  }
  window.addEventListener('popstate', function (e) {
    var d = e.state && typeof e.state.d === 'number' ? e.state.d : 0;
    var wasHome = layers.length === 1;
    while (layers.length > Math.max(d, 1)) closeLayerRaw(layers.pop());
    histDepth = d;
    if (d >= 1) return;
    if (!wasHome) {
      // 중간 단계를 건너뛰고 맨 처음까지 온 경우 → 첫 화면만 보여 주고 나가지 않음
      history.pushState({ d: 1 }, ''); histDepth = 1;
      return;
    }
    if (confirm('샘플 관리 화면을 나갈까요?')) {
      history.back();
      setTimeout(function () { toast('뒤로가기를 한 번 더 누르면 나가집니다.'); }, 400);
    } else {
      history.pushState({ d: 1 }, ''); histDepth = 1;
    }
  });
  // 첫 화면에서 아무 곳이나 처음 누를 때 '나가기 확인'용 단계를 만들어 둠
  document.addEventListener('pointerdown', ensureGuard, true);

  renderPlaces(); renderSub(); updateBar(); load();
</script>
</body>
</html>
