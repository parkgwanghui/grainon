<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>샘플 출고</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --bg:#F1F4F1; --card:#FFFFFF; --ink:#17211B; --sub:#5C6A61; --line:#D8E0DA;
    --green:#2D6A4F; --green-d:#1E4D38; --amber:#F2B233; --red:#B9400E;
    --main:var(--green); --main-d:var(--green-d);
  }
  body.in{--main:#2F5A8A; --main-d:#1F3F63}
  body.stock{--main:#3D4842; --main-d:#27302B}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-text-size-adjust:100%}
  button,input,textarea{font-family:inherit}
  button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--amber);outline-offset:1px}

  header{position:sticky;top:0;z-index:5;background:var(--main);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 12px}
  .htop{display:flex;justify-content:space-between;align-items:center;gap:10px}
  header h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
  header p{margin:4px 0 12px;font-size:13px;opacity:.9;display:flex;align-items:center;flex-wrap:wrap;gap:6px}
  .seg{display:flex;background:rgba(255,255,255,.18);border-radius:10px;padding:3px;flex:none}
  .seg button{border:0;background:transparent;color:#fff;font-size:14px;font-weight:600;padding:7px 12px;border-radius:8px;cursor:pointer}
  .seg button.on{background:#fff;color:var(--main-d)}
  .hbtn{border:0;background:rgba(255,255,255,.22);color:#fff;border-radius:8px;padding:4px 10px;font-size:12.5px;font-weight:600;cursor:pointer}
  .ptop{display:flex;gap:6px;margin:0 0 10px}
  .ptop button{flex:1;border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;border-radius:10px;padding:9px;font-size:15px;font-weight:600;cursor:pointer}
  .ptop button.on{background:#fff;color:var(--main-d);border-color:#fff}
  .ptop.need button{border-color:var(--amber)}
  body.stock .ptop{display:none}
  .sq2{flex:none;display:flex;gap:14px;text-align:right;font-variant-numeric:tabular-nums}
  .sq2 div{min-width:48px}
  .sq2 .pl{display:block;font-size:11.5px;color:var(--sub);font-weight:500}
  .sq2 b{font-size:18px}.sq2 small{font-size:12px;color:var(--sub);margin-left:1px}
  .sq2 .zero b{color:var(--red)}.sq2 .none{font-size:12px;color:var(--sub)}
  .placeline{font-size:14px;color:var(--sub);margin:-2px 0 12px}.placeline b{color:var(--ink);font-size:15px}
  .search{width:100%;border:0;border-radius:10px;padding:12px;font-size:16px;color:var(--ink)}

  main{padding:10px 12px 120px;max-width:640px;margin:0 auto}
  body.stock main{padding-bottom:30px}
  .msg{text-align:center;color:var(--sub);font-size:14px;padding:40px 10px;line-height:1.6}
  .item{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
  .item.on{border-color:var(--main);box-shadow:inset 4px 0 0 var(--main)}
  .info{flex:1;min-width:0}
  .name{font-size:15.5px;font-weight:600;line-height:1.35}
  .meta{font-size:12.5px;color:var(--sub);margin-top:3px}
  .meta .warn{color:var(--red);font-weight:600}
  .step{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
  .step button{width:40px;height:40px;border:0;background:#F5F8F5;font-size:21px;color:var(--main-d);cursor:pointer}
  .step input{width:46px;height:40px;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);text-align:center;font-size:16px;color:var(--ink);-moz-appearance:textfield}
  .step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .sq{flex:none;text-align:right;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
  .sq small{font-size:13px;font-weight:500;color:var(--sub);margin-left:2px}
  .sq.zero{color:var(--red)}
  .sq.none{font-size:13px;font-weight:500;color:var(--sub)}

  .bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:12px;align-items:center}
  body.stock .bar{display:none}
  .bar .sum{flex:1;font-size:13.5px;color:var(--sub)}
  .bar .sum b{display:block;color:var(--ink);font-size:17px}
  .btn{border:0;border-radius:12px;background:var(--main);color:#fff;font-size:16px;font-weight:600;padding:14px 22px;cursor:pointer}
  .btn:disabled{background:#AEB9B1;cursor:default}
  .btn.full{width:100%;margin-top:6px}
  .btn.line{background:#fff;color:var(--main-d);border:1px solid var(--line)}
  .btn.danger{background:#fff;color:var(--red);border:1px solid #E9C9BA}
  .btnrow{display:flex;gap:8px;margin-top:6px}.btnrow .btn{flex:1;padding:13px 10px}

  .overlay{position:fixed;inset:0;background:rgba(23,33,27,.45);z-index:10;display:none}
  .overlay.show{display:block}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;max-height:92vh;overflow-y:auto;background:var(--bg);border-radius:18px 18px 0 0;
    padding:18px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .22s ease;max-width:640px;margin:0 auto}
  .sheet.show{transform:none}
  .sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .sheet-head h2{margin:0;font-size:18px}
  .x{border:0;background:none;font-size:15px;color:var(--sub);padding:8px;cursor:pointer}
  .banner{background:#FFF6DE;border:1px solid #F0DDA6;border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.5;margin-bottom:12px}
  .banner button{border:0;background:none;color:var(--red);font-weight:600;padding:0;margin-left:4px;font-size:13.5px;cursor:pointer}

  .box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px 12px;margin-bottom:14px}
  .crow{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
  .crow:last-child{border-bottom:0}
  .crow .n{flex:1;font-size:14.5px}
  .crow .q{font-weight:700;font-size:15px}
  .crow .rm{border:0;background:none;color:var(--red);font-size:13px;padding:6px;cursor:pointer}

  .field{margin-bottom:14px}
  .field label,.field .lb{display:block;font-size:13.5px;font-weight:600;margin-bottom:6px}
  .field small{font-weight:400;color:var(--sub)}
  .req{color:var(--red);margin-left:2px}
  .field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px;background:#fff;color:var(--ink)}
  .field textarea{resize:vertical;min-height:60px}
  .two{display:flex;gap:10px}.two .field{flex:1;min-width:0}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px;font-size:14px;color:var(--ink);cursor:pointer}
  .chip.on{background:var(--main);border-color:var(--main);color:#fff}
  .chips.big .chip{flex:1;border-radius:10px;padding:12px;font-size:15px;font-weight:600}
  .err{color:var(--red);font-size:13.5px;min-height:18px;margin:4px 0}

  .done{text-align:center;padding:20px 4px 4px}
  .done .big{font-size:40px;line-height:1;color:var(--main)}
  .done h2{margin:12px 0 6px;font-size:19px}
  .done p{margin:0 0 16px;color:var(--sub);font-size:14px;line-height:1.6}
  .hint{font-size:12.5px;color:var(--sub);text-align:center;margin-top:10px}

  .rec{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
  .rec .top{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--sub)}
  .tag{display:inline-block;border-radius:6px;padding:2px 7px;font-size:12px;font-weight:700;color:#fff;background:var(--green);margin-right:6px}
  .tag.in{background:#2F5A8A}
  .rec .body{font-size:14.5px;margin:6px 0 10px;line-height:1.5}
  .rec .btnrow .btn{padding:10px;font-size:14.5px}

  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#17211B;color:#fff;padding:11px 16px;border-radius:10px;font-size:14px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
  .toast.show{opacity:1}
  @media (prefers-reduced-motion:reduce){.sheet,.toast{transition:none}}
</style>
</head>
<body>

<header>
  <div class="htop">
    <h1 id="title">샘플 출고</h1>
    <div class="seg" role="group" aria-label="화면 선택">
      <button type="button" class="on" data-mode="out">출고</button>
      <button type="button" data-mode="in">입고</button>
      <button type="button" data-mode="stock">재고</button>
    </div>
  </div>
  <p id="subtitle"></p>
  <div class="ptop" id="ptop" role="group" aria-label="장소 선택"></div>
  <input id="q" class="search" type="search" placeholder="제품명·샘플ID 검색" autocomplete="off">
</header>

<main id="list"><div class="msg">샘플 목록을 불러오는 중…</div></main>

<div class="bar">
  <div class="sum" id="sum"></div>
  <button class="btn" id="openCart" disabled>담은 목록 보기</button>
</div>

<div class="overlay" id="overlay"></div>
<section class="sheet" id="sheet" aria-label="등록">
  <div id="formView">
    <div class="sheet-head"><h2 id="sheetTitle">출고 등록</h2><button class="x" data-act="close">닫기</button></div>
    <div id="editBanner"></div>
    <div class="box" id="cartBox"></div>
    <div class="two">
      <div class="field"><label for="user">담당자<span class="req">*</span></label><input id="user" autocomplete="name"></div>
      <div class="field"><label for="dept">부서<span class="req">*</span></label><input id="dept"></div>
    </div>
    <div class="placeline" id="placeLine"></div>
    <div class="field"><span class="lb" id="purposeLabel">사용 구분<span class="req">*</span></span><div class="chips" id="chips"></div></div>
    <div class="field"><label for="client" id="clientLabel">제공처 <small>고객사·행사명 등</small></label><input id="client"></div>
    <div class="field"><label for="memo">비고 <small>선택</small></label><textarea id="memo"></textarea></div>
    <div class="err" id="err"></div>
    <button class="btn full" id="submit">출고 등록</button>
  </div>

  <div id="doneView" hidden>
    <div class="done">
      <div class="big">✓</div>
      <h2 id="doneTitle"></h2>
      <p id="doneText"></p>
      <div class="btnrow">
        <button class="btn line" data-act="editLast">수정</button>
        <button class="btn danger" data-act="cancelLast">등록 취소</button>
      </div>
      <button class="btn full" data-act="again">새로 담기</button>
      <div class="hint" id="doneHint"></div>
    </div>
  </div>

  <div id="recentView" hidden>
    <div class="sheet-head"><h2>최근 등록 내역</h2><button class="x" data-act="close">닫기</button></div>
    <div id="recentList"></div>
    <div class="hint" id="recentHint"></div>
  </div>
</section>

<div class="toast" id="toast"></div>

<script>
  // Apps Script 배포 주소 (…/exec). '배포 관리 → 새 버전'으로 재배포하면 주소는 그대로입니다.
  var API = 'https://script.google.com/macros/s/AKfycbz7_-VStBTV5Y2pe3m1mpoTx-GHkZ4JFSa2FTHUMRZAZosYx5xmjT6YI4MjFAFj5qpb1A/exec';

  function unwrap(res) { if (!res.ok) throw new Error(res.error); return res.data; }
  function netErr(e) { return e instanceof TypeError ? new Error('서버에 연결하지 못했습니다. 인터넷 연결을 확인하고 다시 시도하세요.') : e; }
  function apiInit() {
    return fetch(API + '?action=init').then(function (r) { return r.json(); }).then(unwrap).catch(function (e) { throw netErr(e); });
  }
  function apiPost(p) {
    return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(p) })
      .then(function (r) { return r.json(); }).then(unwrap).catch(function (e) { throw netErr(e); });
  }

  var ITEMS = [], PURPOSES = [], IN_PURPOSES = [], PLACES = ['본관', '별관'], LIMIT_MIN = 1440;
  var cart = {}, purpose = '', place = '', mode = 'out', lastLoaded = null, editing = null, lastDone = null;
  var $ = function (s) { return document.querySelector(s); };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function byId(id) { for (var i = 0; i < ITEMS.length; i++) if (ITEMS[i].id === id) return ITEMS[i]; }
  function word() { return mode === 'in' ? '입고' : '출고'; }
  function pad(n) { return ('0' + n).slice(-2); }
  function hhmm(d, sec) { return pad(d.getHours()) + ':' + pad(d.getMinutes()) + (sec ? ':' + pad(d.getSeconds()) : ''); }
  function toast(t) { var el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(function () { el.classList.remove('show'); }, 2600); }
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

  /* 최근 등록 (이 기기에만 저장) */
  function getRecent() {
    var a; try { a = JSON.parse(store('smp_recent') || '[]'); } catch (e) { a = []; }
    var now = Date.now();
    return a.filter(function (r) { return now - r.at < LIMIT_MIN * 60000; });
  }
  function setRecent(a) { store('smp_recent', JSON.stringify(a.slice(0, 20))); }
  function addRecent(r) { var a = getRecent().filter(function (x) { return x.reqNo !== r.reqNo; }); a.unshift(r); setRecent(a); }
  function removeRecent(no) { setRecent(getRecent().filter(function (x) { return x.reqNo !== no; })); }
  function minsLeft(r) { return Math.max(0, Math.ceil((LIMIT_MIN * 60000 - (Date.now() - r.at)) / 60000)); }
  function dur(min) {
    var h = Math.floor(min / 60), m = min % 60;
    return h && m ? h + '시간 ' + m + '분' : h ? h + '시간' : m + '분';
  }
  function when(ms) {
    var d = new Date(ms), now = new Date();
    return (d.toDateString() === now.toDateString() ? '오늘 ' : (d.getMonth() + 1) + '/' + d.getDate() + ' ') + hhmm(d);
  }
  function summary(r) {
    var f = r.items[0], more = r.items.length - 1;
    return esc(f.name) + ' ' + f.qty + esc(f.unit) + (more > 0 ? ' 외 ' + more + '건' : '');
  }

  /* 불러오기 */
  function load() {
    return apiInit().then(function (d) {
      ITEMS = d.items; PURPOSES = d.purposes; IN_PURPOSES = d.inPurposes || []; PLACES = d.places || PLACES;
      if (d.editLimitMin) LIMIT_MIN = d.editLimitMin;
      lastLoaded = new Date();
      renderSub(); renderList(); renderChips();
    }).catch(function (e) {
      $('#list').innerHTML = '<div class="msg">목록을 불러오지 못했습니다.<br>' + esc(e.message) + '</div>';
    });
  }

  /* 헤더 */
  function renderSub() {
    var el = $('#subtitle');
    if (mode === 'stock') {
      el.innerHTML = '<span>' + (lastLoaded ? hhmm(lastLoaded, true) + ' 기준 · 30초마다 자동 갱신' : '불러오는 중…') + '</span>' +
        '<button type="button" class="hbtn" data-act="refresh">새로고침</button>';
      return;
    }
    var n = getRecent().length;
    el.innerHTML = '<span>' + (mode === 'in' ? '들어온 샘플을 담고 한 번에 등록하세요' : '필요한 샘플을 담고 한 번에 등록하세요') + '</span>' +
      (n ? '<button type="button" class="hbtn" data-act="recent">최근 등록 ' + n + '건</button>' : '');
  }

  /* 목록 */
  function st(it, p) { var v = it.stock && it.stock[p]; return v === undefined ? '' : v; }
  function avail(it) {
    var s = st(it, place);
    if (s === '') return '';
    if (editing && editing.type === 'out' && editing.place === place) editing.items.forEach(function (x) { if (x.id === it.id) s += x.qty; });
    return s;
  }
  function stockText(it, qty) {
    if (!place) return '장소를 먼저 선택하세요';
    var s = st(it, place);
    if (s === '') return place + ' 재고 미관리';
    var t = place + ' 재고 ' + s + esc(it.unit);
    return (mode === 'out' && qty > avail(it)) ? '<span class="warn">' + t + ' · 부족</span>' : t;
  }
  function renderList() {
    var q = $('#q').value.trim().toLowerCase();
    var list = ITEMS.filter(function (it) { return !q || (it.name + ' ' + it.id + ' ' + it.spec).toLowerCase().indexOf(q) > -1; });
    if (!ITEMS.length) { $('#list').innerHTML = '<div class="msg">등록된 샘플이 없습니다.<br>시트의 샘플목록 탭에 품목을 추가하세요.</div>'; return; }
    if (!list.length) { $('#list').innerHTML = '<div class="msg">‘' + esc(q) + '’와 일치하는 샘플이 없습니다.</div>'; return; }
    if (mode === 'stock') {
      $('#list').innerHTML = list.map(function (it) {
        var sq = '<div class="sq2">' + PLACES.map(function (p) {
          var s = st(it, p);
          return s === '' ? '<div><span class="pl">' + esc(p) + '</span><span class="none">미관리</span></div>'
            : '<div class="' + (s <= 0 ? 'zero' : '') + '"><span class="pl">' + esc(p) + '</span><b>' + esc(s) + '</b><small>' + esc(it.unit) + '</small></div>';
        }).join('') + '</div>';
        return '<div class="item"><div class="info"><div class="name">' + esc(it.name) + '</div><div class="meta">' +
          esc(it.spec) + (it.spec ? ' · ' : '') + esc(it.id) + '</div></div>' + sq + '</div>';
      }).join('');
      return;
    }
    $('#list').innerHTML = list.map(function (it) {
      var qty = cart[it.id] || 0;
      return '<div class="item' + (qty ? ' on' : '') + '" data-id="' + esc(it.id) + '">' +
        '<div class="info"><div class="name">' + esc(it.name) + '</div>' +
        '<div class="meta">' + esc(it.spec) + (it.spec ? ' · ' : '') + '<span class="st">' + stockText(it, qty) + '</span></div></div>' +
        '<div class="step"><button type="button" data-d="-1" aria-label="빼기">−</button>' +
        '<input type="number" inputmode="numeric" min="0" value="' + (qty || '') + '" placeholder="0" aria-label="수량">' +
        '<button type="button" data-d="1" aria-label="더하기">+</button></div></div>';
    }).join('');
  }
  function setQty(id, v) {
    v = Math.max(0, parseInt(v, 10) || 0);
    if (v) cart[id] = v; else delete cart[id];
    var row = document.querySelector('.item[data-id="' + CSS.escape(id) + '"]');
    if (row) {
      row.classList.toggle('on', v > 0);
      var inp = row.querySelector('input');
      if (document.activeElement !== inp) inp.value = v || '';
      row.querySelector('.st').innerHTML = stockText(byId(id), v);
    }
    updateBar();
  }
  function updateBar() {
    var ids = Object.keys(cart), total = 0;
    ids.forEach(function (id) { total += cart[id]; });
    var pre = editing ? '수정 중 · ' : '';
    $('#sum').innerHTML = ids.length
      ? '<b>' + pre + ids.length + '개 품목 · 총 ' + total + '개</b>담은 목록에서 등록하세요'
      : '<b>' + (editing ? '수정 중 · ' : '') + '담긴 샘플 없음</b>수량을 눌러 담아 주세요';
    $('#openCart').disabled = !ids.length;
  }

  /* 선택 칩 */
  function chipHtml(list, sel, attr) {
    return list.map(function (p) {
      return '<button type="button" class="chip' + (p === sel ? ' on' : '') + '" ' + attr + '="' + esc(p) + '">' + esc(p) + '</button>';
    }).join('');
  }
  function renderChips() {
    $('#chips').innerHTML = chipHtml(mode === 'in' ? IN_PURPOSES : PURPOSES, purpose, 'data-p');
    renderPlaces();
  }
  function renderPlaces() {
    $('#ptop').innerHTML = PLACES.map(function (p) {
      return '<button type="button" data-pl="' + esc(p) + '" class="' + (p === place ? 'on' : '') + '">' + esc(p) + '</button>';
    }).join('');
    $('#ptop').classList.toggle('need', !place);
    $('#placeLine').innerHTML = place ? '장소 <b>' + esc(place) + '</b> · 바꾸려면 화면 위에서 선택하세요' : '';
  }
  function setPlace(p) {
    if (PLACES.indexOf(p) < 0) return;
    place = p; store('smp_place', p);
    renderPlaces(); renderList();
  }

  /* 시트(아래에서 올라오는 창) */
  function showView(v) {
    $('#formView').hidden = v !== 'form'; $('#doneView').hidden = v !== 'done'; $('#recentView').hidden = v !== 'recent';
    $('#overlay').classList.add('show'); $('#sheet').classList.add('show'); $('#sheet').scrollTop = 0;
  }
  function closeSheet() { $('#overlay').classList.remove('show'); $('#sheet').classList.remove('show'); }
  function renderCart() {
    $('#cartBox').innerHTML = Object.keys(cart).map(function (id) {
      var it = byId(id);
      return '<div class="crow"><span class="n">' + esc(it.name) + (it.spec ? ' <small style="color:var(--sub)">' + esc(it.spec) + '</small>' : '') +
        '</span><span class="q">' + cart[id] + esc(it.unit) + '</span><button class="rm" data-rm="' + esc(id) + '">빼기</button></div>';
    }).join('');
    $('#editBanner').innerHTML = editing
      ? '<div class="banner">요청번호 <b>' + esc(editing.reqNo) + '</b> 수정 중이에요. 등록하면 기존 내역은 자동으로 취소 처리돼요.' +
        '<button type="button" data-act="stopEdit">수정 그만두기</button></div>' : '';
  }
  function openForm() { renderCart(); $('#err').textContent = ''; showView('form'); }

  function setMode(m) {
    mode = m; purpose = '';
    document.body.classList.toggle('in', m === 'in');
    document.body.classList.toggle('stock', m === 'stock');
    document.querySelectorAll('.seg button').forEach(function (b) { b.classList.toggle('on', b.dataset.mode === m); });
    var w = word();
    $('#title').textContent = m === 'stock' ? '샘플 재고' : '샘플 ' + w;
    $('#sheetTitle').textContent = (editing ? w + ' 수정' : w + ' 등록');
    $('#submit').textContent = editing ? '수정 내용 등록' : w + ' 등록';
    $('#purposeLabel').innerHTML = (m === 'in' ? '입고 구분' : '사용 구분') + '<span class="req">*</span>';
    $('#clientLabel').innerHTML = m === 'in' ? '입고처 <small>공급처·반납자 등</small>' : '제공처 <small>고객사·행사명 등</small>';
    renderSub(); renderChips(); renderList();
    if (m === 'stock') load();
  }

  /* 최근 등록 · 수정 · 취소 */
  function renderRecent() {
    var a = getRecent();
    $('#recentList').innerHTML = a.length ? a.map(function (r) {
      return '<div class="rec"><div class="top"><span><span class="tag' + (r.type === 'in' ? ' in' : '') + '">' + (r.type === 'in' ? '입고' : '출고') +
        '</span>' + when(r.at) + ' · ' + esc(r.place) + ' · ' + esc(r.purpose) + '</span><span>' + dur(minsLeft(r)) + ' 남음</span></div>' +
        '<div class="body">' + summary(r) + '</div>' +
        '<div class="btnrow"><button class="btn line" data-edit="' + esc(r.reqNo) + '">수정</button>' +
        '<button class="btn danger" data-cancel="' + esc(r.reqNo) + '">취소</button></div></div>';
    }).join('') : '<div class="msg">수정·취소할 수 있는 최근 등록이 없습니다.</div>';
    $('#recentHint').textContent = '이 기기에서 등록한 건만, 등록 후 ' + dur(LIMIT_MIN) + ' 안에 수정·취소할 수 있어요.';
  }
  function findRecent(no) { return getRecent().filter(function (x) { return x.reqNo === no; })[0]; }

  function startEdit(r) {
    if (!r) { toast('수정 가능 시간이 지났어요.'); return; }
    editing = r;
    setMode(r.type === 'in' ? 'in' : 'out');
    purpose = r.purpose; place = r.place; store('smp_place', place);
    cart = {};
    var missing = 0;
    r.items.forEach(function (it) { if (byId(it.id)) cart[it.id] = it.qty; else missing++; });
    $('#user').value = r.user; $('#dept').value = r.dept; $('#client').value = r.client || ''; $('#memo').value = r.memo || '';
    renderChips(); renderList(); updateBar(); openForm();
    if (missing) toast('목록에서 빠진 품목 ' + missing + '개는 제외됐어요.');
  }
  function stopEdit() {
    editing = null; cart = {}; purpose = ''; $('#client').value = ''; $('#memo').value = '';
    setMode(mode); updateBar(); closeSheet();
  }
  function doCancel(r) {
    if (!r) { toast('취소 가능 시간이 지났어요.'); return; }
    if (!confirm('요청번호 ' + r.reqNo + '(' + summary(r).replace(/<[^>]+>/g, '') + ')을 취소할까요?\n재고가 등록 전으로 돌아갑니다.')) return;
    apiPost({ action: 'cancel', reqNo: r.reqNo, token: r.token }).then(function () {
      removeRecent(r.reqNo);
      if (lastDone && lastDone.reqNo === r.reqNo) lastDone = null;
      closeSheet(); toast('등록이 취소됐어요.'); renderSub(); load();
    }).catch(function (e) { alert(String(e.message || e).replace(/^Error:\s*/, '')); });
  }

  /* 이벤트 */
  $('#list').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-d]'); if (!b) return;
    if (!place) { toast('먼저 위에서 장소(본관/별관)를 선택하세요.'); return; }
    var id = b.closest('.item').dataset.id;
    setQty(id, (cart[id] || 0) + Number(b.dataset.d));
  });
  $('#list').addEventListener('input', function (e) {
    if (e.target.tagName !== 'INPUT') return;
    if (!place) { e.target.value = ''; toast('먼저 위에서 장소(본관/별관)를 선택하세요.'); return; }
    setQty(e.target.closest('.item').dataset.id, e.target.value);
  });
  $('#q').addEventListener('input', renderList);
  document.querySelector('.seg').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-mode]'); if (!b || b.dataset.mode === mode) return;
    if (editing) { editing = null; cart = {}; updateBar(); toast('수정을 그만뒀어요.'); }
    setMode(b.dataset.mode);
  });
  $('header').addEventListener('click', function (e) {
    var a = e.target.dataset && e.target.dataset.act;
    var pb = e.target.closest('[data-pl]'); if (pb) setPlace(pb.dataset.pl);
    if (a === 'refresh') { e.target.textContent = '갱신 중…'; load(); }
    if (a === 'recent') { renderRecent(); showView('recent'); }
  });
  $('#openCart').addEventListener('click', openForm);
  $('#overlay').addEventListener('click', closeSheet);

  $('#sheet').addEventListener('click', function (e) {
    var t = e.target.closest('[data-act],[data-rm],[data-p],[data-pl],[data-edit],[data-cancel]'); if (!t) return;
    var d = t.dataset;
    if (d.rm) { setQty(d.rm, 0); if (!Object.keys(cart).length) closeSheet(); else renderCart(); }
    else if (d.p) { purpose = d.p; renderChips(); }
    else if (d.pl) { place = d.pl; renderChips(); }
    else if (d.edit) startEdit(findRecent(d.edit));
    else if (d.cancel) doCancel(findRecent(d.cancel));
    else if (d.act === 'close') closeSheet();
    else if (d.act === 'stopEdit') stopEdit();
    else if (d.act === 'again') { closeSheet(); window.scrollTo(0, 0); }
    else if (d.act === 'editLast') startEdit(lastDone && findRecent(lastDone.reqNo));
    else if (d.act === 'cancelLast') doCancel(lastDone && findRecent(lastDone.reqNo));
  });

  // 담당자·부서·장소는 다음에 자동으로 채움
  $('#user').value = store('smp_user') || '';
  $('#dept').value = store('smp_dept') || '';
  place = store('smp_place') || '';

  $('#submit').addEventListener('click', function () {
    var user = $('#user').value.trim(), dept = $('#dept').value.trim();
    var err = !user ? '담당자 이름을 입력하세요.' : !dept ? '부서를 입력하세요.' : !place ? '화면 위에서 장소(본관/별관)를 선택하세요.'
      : !purpose ? (mode === 'in' ? '입고' : '사용') + ' 구분을 선택하세요.' : '';
    if (err) { $('#err').textContent = err; return; }

    var ids = Object.keys(cart);
    var payload = {
      type: mode, user: user, dept: dept, place: place, purpose: purpose,
      client: $('#client').value.trim(), memo: $('#memo').value.trim(),
      items: ids.map(function (id) { return { id: id, qty: cart[id] }; })
    };
    var wasEdit = editing;
    if (wasEdit) { payload.replaceReqNo = wasEdit.reqNo; payload.replaceToken = wasEdit.token; }
    store('smp_user', user); store('smp_dept', dept); store('smp_place', place);

    var btn = $('#submit'), label = btn.textContent;
    btn.disabled = true; btn.textContent = '등록하는 중…'; $('#err').textContent = '';
    apiPost(payload).then(function (r) {
      btn.disabled = false;
      var rec = { reqNo: r.reqNo, token: r.token, at: Date.now(), type: mode, user: user, dept: dept, place: place, purpose: purpose,
        client: payload.client, memo: payload.memo,
        items: ids.map(function (id) { var it = byId(id); return { id: id, qty: cart[id], name: it.name, unit: it.unit }; }) };
      if (wasEdit) removeRecent(wasEdit.reqNo);
      addRecent(rec); lastDone = rec; editing = null;
      $('#doneTitle').textContent = wasEdit ? '수정됐어요' : word() + '가 등록됐어요';
      $('#doneText').innerHTML = esc(place) + ' · ' + esc(r.count) + '개 품목, 총 ' + esc(r.total) + '개<br>요청번호 ' + esc(r.reqNo);
      $('#doneHint').textContent = '잘못 등록했다면 ' + dur(LIMIT_MIN) + ' 안에 수정하거나 취소할 수 있어요.';
      cart = {}; purpose = ''; $('#client').value = ''; $('#memo').value = '';
      setMode(mode); updateBar(); showView('done'); load();
    }).catch(function (e) {
      btn.disabled = false; btn.textContent = label;
      $('#err').textContent = String(e.message || e).replace(/^Error:\s*/, '');
    });
  });

  setInterval(function () { if (mode === 'stock' && !document.hidden) load(); }, 30000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden && mode === 'stock') load(); });

  renderSub(); updateBar(); load();
</script>
</body>
</html>
