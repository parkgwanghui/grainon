<style>

.wrap{max-width:1180px;margin:0 auto}

let qF='all',qZ='',qT='';
function query(){
  const F=NODATA?[['all','전체'],['manual','수기 등록'],['okE','빈칸 확인'],['hold','보류'],['empty','미확인']]:[['all','전체'],['diff','상이·수정'],['hold','보류'],['todo','미실사'],['ok','확인완료'],['okE','빈칸 확인']];

  const t=qT.trim().toLowerCase();if(t)ls=ls.filter(l=>{const s=S[l.code]||{};return (l.code+' '+l.item+' '+(s.fix?s.fix.item:'')+' '+(s.reason||'')+' '+(s.memo||'')).toLowerCase().includes(t)});

   ${ls.slice(0,300).map(l=>{const s=S[l.code],k=status(l),f=s&&s.fix;return `<tr class="qr" data-c="${l.code}" style="cursor:pointer"><td class="num">${l.code}</td><td style="text-align:left">${esc(l.item)}</td><td class="num">${Q(l.qty)}</td><td class="num">${fmtExp(l.exp)}</td><td style="text-align:left"><span class="tg ${k==='okE'?'ok':k}">${LABEL[k]}</span></td><td style="text-align:left">${f?(f.empty?'비어 있음':`${esc(f.item)} / ${Q(f.qty)} / ${fmtExp(f.exp)}`):''}</td><td class="num" style="color:var(--bad)">${f?esc(diffTxt(l,f).replace('수량 차이 ','')):''}</td><td style="text-align:left">${esc([s&&s.reason,s&&s.memo].filter(Boolean).join(' - '))}</td><td>${s?esc(s.user):''}</td><td class="num">${s?s.t:''}</td></tr>`}).join('')}</table></div>
   ${ls.length>300?'<p class="note">앞의 300건만 표시합니다. 존이나 검색어로 좁혀 보세요.</p>':''}${ls.length?'':'<p class="note">조건에 맞는 로케이션이 없습니다.</p>'}`;

/* ---- 배치도 ---- */
function map(){
  if(!cur)cur=(LOCS.find(l=>status(l)==='todo')||LOCS[0]).code;
  const H=zoom?40:22,W=zoom?78:20;
  const zonesTop=WID==='c1'?[...ZONES].reverse():ZONES; // 배치도처럼 A09가 위
  let html='';
  for(const z of zonesTop){
    const ls=LOCS.filter(l=>l.zone===z&&l.reg);const lv=Math.max(...ls.map(l=>l.level)),rk=Math.max(...ls.map(l=>l.rack));
    html+=`<div class="zone"><h3>${z}</h3><div class="g" style="grid-template-columns:34px repeat(${rk*2},${W}px);--h:${H}px"><span></span>`;
    for(let r=1;r<=rk;r++)html+=`<span class="rh" style="grid-column:span 2">${pad(r)}</span>`;
    for(let v=lv;v>=1;v--){html+=`<span class="lv">${v}층</span>`;
      for(let r=1;r<=rk;r++)for(let b=1;b<=2;b++){const l=BY[`${z}-${pad(r)}-${pad(v)}-${pad(b)}`];
        if(!l){html+='<span></span>';continue}const s=status(l);
        html+=`<button class="c ${s==='todo'?'s':s}${l.code===cur?' here':''}" data-c="${l.code}" title="${l.code} · ${LABEL[s]}${l.item?' · '+esc(l.item):''}">${zoom?(b===1?'왼':'오'):''}</button>`}}
    html+='</div>';
    const ex=LOCS.filter(l=>l.zone===z&&!l.reg);
    if(ex.length)html+=`<div class="extra">${ex.map(l=>{const s=status(l);return `<button class="c ${s==='todo'?'s':s}${l.code===cur?' here':''}" data-c="${l.code}" title="${LABEL[s]}">${esc(l.code.slice(4))}</button>`}).join('')}</div>`;
    html+='</div>';
  }
  $('pg').innerHTML=`<section class="panel">
    <div class="mtools"><input class="in" id="jump" placeholder="로케이션 이동 예) A05-09-02-01"><button class="btn" id="jb">이동</button>
    ${cur?`<button class="btn p" id="hb">현재 위치 ${cur}</button>`:''}<button class="btn" id="zm">${zoom?'작게 보기':'크게 보기'}</button>
    <select class="in" id="zj" style="max-width:120px"><option value="">존 이동</option>${zonesTop.map(z=>`<option>${z}</option>`).join('')}</select></div>
    <div class="lg" style="margin:0 0 10px"><em style="--c:var(--todo)">미실사</em><em style="--c:var(--ok)">확인완료</em><em style="--c:var(--bad)">상이</em><em style="--c:var(--hold)">보류</em><em style="--c:var(--man)">수기 등록</em><em style="--c:var(--empty)">${NODATA?'미확인':'재고 없음'}</em><em style="--c:var(--emptyok)">빈칸 확인</em><em style="--c:var(--ink)">현재 위치(검은 테두리·흰 점)</em></div>
    <div class="mapbox ${zoom?'zoom':''}" id="mb">${html}</div>
    <p class="note">위아래·좌우로 스크롤할 수 있습니다. 칸을 누르면 그 로케이션 실사 화면으로 이동합니다. 각 랙은 왼쪽·오른쪽 2칸, 아래가 1층입니다.</p></section>`;
  document.querySelectorAll('#mb .c').forEach(b=>b.onclick=()=>{cur=b.dataset.c;mode='loc';tab='count';form='';render()});
  $('zm').onclick=()=>{zoom=!zoom;map()};
  const here=()=>{const h=document.querySelector('#mb .c.here');if(h)h.scrollIntoView({block:'center',inline:'center',behavior:'smooth'})};if($('hb'))$('hb').onclick=here;here();
  const jump=()=>{const v=$('jump').value.trim().toUpperCase();const l=BY[v]||LOCS.find(x=>x.code.includes(v));if(!v)return;if(!l){toast('해당 로케이션이 없습니다');return}
    const el=document.querySelector(`#mb .c[data-c="${CSS.escape(l.code)}"]`);document.querySelectorAll('.c.hit').forEach(x=>x.classList.remove('hit'));el.classList.add('hit');el.scrollIntoView({block:'center',inline:'center',behavior:'smooth'})};
  $('jb').onclick=jump;$('jump').onkeydown=e=>{if(e.key==='Enter')jump()};
  $('zj').onchange=e=>{const h=[...document.querySelectorAll('#mb h3')].find(x=>x.textContent===e.target.value);if(h)h.scrollIntoView({block:'start',behavior:'smooth'})};
}

function routeList(){return mode==='loc'?LOCS:LOCS.filter(l=>l.item===curItem||(S[l.code]&&S[l.code].fix&&S[l.code].fix.item===curItem))}
function count(){
  if(mode==='loc'&&!cur)cur=(LOCS.find(l=>status(l)==='todo')||LOCS[0]).code;
  const list=routeList();
  let pick='';
  if(mode==='loc'){
    const l=BY[cur];
    pick=`<div class="sel"><select class="in" id="sz">${ZONES.map(z=>`<option ${z===l.zone?'selected':''}>${z}</option>`).join('')}</select>
      
      <select class="in" id="sf"><option value="all">전체</option><option value="todo">미실사만</option><option value="hold">보류만</option><option value="diff">상이만</option></select></div>

      <p class="note" style="margin:0 0 6px">${curItem?`${list.length}개 로케이션 · 안내 순서대로`:'품목을 선택하면 해당 품목이 있는 로케이션이 나옵니다.'}</p>`;
  }
  $('pg').innerHTML=`<div class="seg"><button class="${mode==='loc'?'on':''}" data-m="loc">로케이션별</button><button class="${mode==='item'?'on':''}" data-m="item">품목별</button></div>
  <div class="cw"><section class="panel">${pick}<div class="route" id="rt"></div></section><section class="panel" id="dt"></section></div>`;
  document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;form='';if(mode==='item'&&cur&&BY[cur].item&&!curItem)curItem=BY[cur].item;count()});
  const drawRoute=()=>{let ls=list;
    if(mode==='loc'){const f=$('sf').value;ls=LOCS.filter(x=>x.zone===$('sz').value);if(f!=='all')ls=ls.filter(x=>status(x)===f)}
    $('rt').innerHTML=ls.length?ls.map(l=>{const s=status(l);return `<button class="ri ${l.code===cur?'cur':''}" data-c="${l.code}"><span><b class="num">${l.code}</b><small>${l.item?esc(l.item):'재고 없음'}</small></span><span class="tg ${s==='okE'?'ok':s}">${LABEL[s]}</span></button>`}).join(''):'<p class="note">해당하는 로케이션이 없습니다.</p>';
    $('rt').querySelectorAll('.ri').forEach(b=>b.onclick=()=>{cur=b.dataset.c;form='';count()});
    const c=$('rt').querySelector('.ri.cur');if(c)c.scrollIntoView({block:'nearest'})};
  if(mode==='loc'){['sz','sf'].forEach(id=>$(id).onchange=drawRoute);
    $('lq').onkeydown=e=>{if(e.key!=='Enter')return;const v=e.target.value.trim().toUpperCase();const l=BY[v]||LOCS.find(x=>x.code.includes(v));if(!l){toast('해당 로케이션이 없습니다');return}cur=l.code;form='';count()}}
  else $('iq').onchange=e=>{curItem=e.target.value;const f=routeList()[0];cur=f?f.code:null;form='';count()};
  drawRoute();detail(list);
}
function detail(list){
  const d=$('dt');if(!cur||(mode==='item'&&!curItem)){d.innerHTML='<p class="note">왼쪽에서 로케이션을 선택하세요.</p>';return}
  const l=BY[cur],s=S[l.code],stt=status(l);
  const pos=l.reg?`${l.zone} 존 · ${l.rack}번 랙 · ${l.level}층 · ${l.bin===1?'왼쪽':'오른쪽'}`:`${l.zone} 존 · 통로바닥/선반 등`;
  let res='';
  if(s){const f=s.fix;res=`<div class="result ${s.st==='ok'?'ok':s.st}"><b>${LABEL[stt]} · ${esc(s.user)} · ${s.t}</b>
    ${s.st==='diff'?`<span class="strike">${esc(l.item||'비어 있음')} ${Q(l.qty)} ${fmtExp(l.exp)}</span> → `:''}${f?`<b style="display:inline">${f.empty?'비어 있음':`${esc(f.item)} ${Q(f.qty)} ${fmtExp(f.exp)}`}</b>`:''}${f&&diffTxt(l,f)?`<div style="margin-top:4px;font-weight:700">${diffTxt(l,f)}</div>`:''}
    ${s.reason?`<div>사유: ${esc(s.reason)}</div>`:''}${s.memo?`<div>메모: ${esc(s.memo)}</div>`:''}</div>`}
  const i=list.findIndex(x=>x.code===cur);
  d.innerHTML=`<div class="code num">${l.code}</div><div class="note">${pos}</div><button class="btn sm" id="toMap" style="margin-top:6px">배치도에서 위치 보기</button>${res}
   <dl class="dl"><dt>품목</dt><dd>${l.item?esc(l.item):`<span class="note">${NODATA?'전산 정보 없음 · 실물이 있으면 수기 등록':'재고 없음'}</span>`}</dd>
   <dt>수량</dt><dd class="num">${l.qty!=null?Q(l.qty):'-'}</dd>
   <dt>소비기한</dt><dd>${l.exp?`<button class="lot" id="lot">${fmtExp(l.exp)}</button>`:'-'}</dd></dl>
   <div class="acts"><button class="btn ok" id="aOk">${l.item?'확인완료':'빈칸 확인'}</button><button class="btn bad" id="aFix">${NODATA?'수기 등록':'상이·수정'}</button><button class="btn hold" id="aHold">보류</button></div>
   <div class="form ${form==='fix'?'on':''}" id="fFix"><b>${NODATA?'실물 정보 수기 등록':'올바른 실사정보 입력'}</b>
     <label style="display:flex;gap:6px;align-items:center;margin:8px 0;font-size:14px"><input type="checkbox" id="fe"> 실제로 비어 있음</label>
     <input class="in" id="fi" list="idl2" placeholder="품목명" value="${esc(s&&s.fix?s.fix.item:l.item)}" style="margin-bottom:8px"><datalist id="idl2">${ITEMS.map(x=>`<option value="${esc(x)}">`).join('')}</datalist>
     <div class="g2"><input class="in num" id="fq" type="number" inputmode="numeric" placeholder="실제 수량 (개)" value="${s&&s.fix?s.fix.qty:(l.qty??'')}"><input class="in num" id="fx" placeholder="소비기한 예) 20271231" value="${s&&s.fix?s.fix.exp:l.exp}"></div>
     <input class="in" id="fm" placeholder="메모 (선택)" style="margin:8px 0"><button class="btn p" id="fSave" style="width:100%">수정 정보 저장</button></div>
   <div class="form ${form==='hold'?'on':''}" id="fHold"><b>보류 사유</b>
     <select class="in" id="hr" style="margin:8px 0"><option>상단 적재로 확인 불가</option><option>박스 훼손·라벨 확인 불가</option><option>혼적으로 수량 확인 어려움</option><option>작업 중(입출고) 위치</option><option>기타</option></select>
     <textarea class="in" id="hm" placeholder="상세 사유 기재"></textarea><button class="btn p" id="hSave" style="width:100%;margin-top:8px">보류 저장</button></div>
   <div class="nav"><button class="btn" id="pv" ${i<=0?'disabled':''}>이전</button>${s?'<button class="btn sm" id="undo">처리 취소</button>':''}<button class="btn p" id="nx" ${i>=list.length-1?'disabled':''}>다음 로케이션</button></div>
   <p class="note">처리하면 다음 로케이션으로 자동 이동합니다 (존 안에서 1번 랙 1층 왼·오 → 2층 → … → 4층 → 다음 랙 순서).</p>`;
  const next=()=>{const n=list[i+1];if(n){cur=n.code}form='';count()};
  const set=(st0,extra,act,after,reason)=>{S[l.code]=Object.assign({st:st0,user,t:now()},extra);record(l,act,after,reason);toast(`${l.code} ${act}`);next()};
  $('aOk').onclick=()=>set('ok',{},l.item?'확인완료':'빈칸 확인');
  $('aFix').onclick=()=>{form=form==='fix'?'':'fix';detail(list)};
  $('aHold').onclick=()=>{form=form==='hold'?'':'hold';detail(list)};
  if($('fSave'))$('fSave').onclick=()=>{const empty=$('fe').checked,fx={empty,item:empty?'':$('fi').value.trim(),qty:empty?0:+$('fq').value,exp:empty?'':$('fx').value.trim()};
    if(!empty&&(!fx.item||$('fq').value==='')){toast('품목과 수량을 입력하세요');return}
    set(NODATA?'manual':'diff',{fix:fx,memo:$('fm').value.trim()},NODATA?'수기 등록':'수정',(empty?'(비어 있음)':`${fx.item} / ${Q(fx.qty)} / ${fmtExp(fx.exp)}`)+(diffTxt(l,fx)?' · '+diffTxt(l,fx):''),$('fm').value.trim())};
  if($('hSave'))$('hSave').onclick=()=>{const r=$('hr').value,m=$('hm').value.trim();if(r==='기타'&&!m){toast('기타 사유를 기재하세요');return}
    set('hold',{reason:r,memo:m},'보류','',r+(m?' - '+m:''))};
  if($('undo'))$('undo').onclick=()=>{if(!confirm('처리 내용을 취소하고 미실사로 되돌릴까요? 기록은 그대로 남습니다.'))return;
    delete S[l.code];record(l,'처리 취소',`이전 처리: ${LABEL[stt]}`,'');toast('취소했습니다 (작업기록에 남음)');count()};
  $('pv').onclick=()=>{cur=list[i-1].code;form='';count()};$('toMap').onclick=()=>{tab='map';render()};$('nx').onclick=next;
  if($('lot'))$('lot').onclick=()=>{$('lotB').innerHTML=`<b style="font-size:17px">LOT 정보</b><p class="note">지금은 소비기한만 있습니다. LOT 번호가 들어오면 아래 항목이 채워집니다.</p>
    <dl class="dl"><dt>LOT 번호</dt><dd>-</dd><dt>품목</dt><dd>${esc(l.item)}</dd><dt>제조일자</dt><dd>-</dd><dt>소비기한</dt><dd>${fmtExp(l.exp)}</dd><dt>입고일자</dt><dd>-</dd></dl><button class="btn" style="width:100%" onclick="$('lotM').classList.remove('show')">닫기</button>`;$('lotM').classList.add('show')};
}

/* ---- 작업기록 (구글시트 '작업로그'와 같은 형태) ---- */
function log(got){
  if(LIVE&&!got){$('pg').innerHTML='<p class="note">시트에서 작업기록을 불러오는 중…</p>';api({action:'log'}).then(r=>{LOG=r.log;if(tab==='log')log(true)}).catch(e=>{toast('불러오기 실패: '+e.message);log(true)});return}
  const us=[...new Set(LOG.map(g=>g.user))];let ls=[...LOG].reverse();if(logF!=='all')ls=ls.filter(g=>g.user===logF);
  $('pg').innerHTML=`<section class="panel"><h2>작업기록 <small>구글시트 '작업로그' 시트에 이 형태로 한 줄씩 쌓이며, 수정·취소해도 지워지지 않습니다</small></h2>
   <div class="chips"><button class="chip ${logF==='all'?'on':''}" data-u="all">전체 ${LOG.length}</button>${us.map(u=>`<button class="chip ${logF===u?'on':''}" data-u="${esc(u)}">${esc(u)}</button>`).join('')}</div>
   <div class="tscroll"><table><tr><th>일시</th><th>창고</th><th>담당자</th><th style="text-align:left">작업</th><th style="text-align:left">로케이션</th><th style="text-align:left">전산 정보</th><th style="text-align:left">실사 결과</th><th style="text-align:left">사유·메모</th></tr>
   ${ls.slice(0,500).map(g=>`<tr><td class="num">${g.t}</td><td>${esc(g.wh||'1센터')}</td><td>${esc(g.user)}</td><td style="text-align:left">${esc(g.act)}</td><td style="text-align:left" class="num">${esc(g.loc)}</td><td style="text-align:left">${esc(g.before)}</td><td style="text-align:left">${esc(g.after)}</td><td style="text-align:left">${esc(g.reason)}</td></tr>`).join('')}</table></div>
   ${LOG.length?'':'<p class="note">아직 기록이 없습니다.</p>'}</section>`;
  document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{logF=c.dataset.u;log(true)});
}
boot();
</script></body></html>
